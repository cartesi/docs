openapi: 3.0.0
servers:
  - url: http://localhost:10012
    description: Default inspect address of a local rollups node (CARTESI_INSPECT_ADDRESS)

info:
  title: Inspect-state HTTP API for Cartesi Rollups
  version: 2.0.0-alpha.14
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

  description: |
    API that allows the application frontend to make inspect-state requests to the application backend
    through a Cartesi Rollups node.

    This reference describes the inspect server of rollups-node v2.0.0-alpha.14.
    The node serves it on the address set by `CARTESI_INSPECT_ADDRESS` (default `:10012`).
    CORS is disabled by default; to call the API from a browser, the node operator must list the
    allowed origins in `CARTESI_INSPECT_CORS_ALLOWED_ORIGINS`.

paths:
  /inspect/{application}:
    post:
      operationId: inspect
      summary: Inspect application state
      description: |
        This method sends an inspect-state request to the application backend. The request body is
        passed to the backend unchanged, as the raw bytes of the inspect payload. The node does not
        interpret the body or its content type. The body can be at most 2 MiB (the size of the
        Cartesi Machine CMIO RX buffer); larger bodies are rejected with HTTP 413.

        Only `POST` is accepted. Other HTTP methods receive HTTP 405 with an `Allow: POST` header.

        The node runs the request on a fork of the application's current machine state, so the
        inspect cannot change the application state. `processed_input_count` tells how many inputs
        that state includes. Inspect requests run concurrently: each application accepts up to its
        `max_concurrent_inspects` execution parameter (default 10) at a time, and the whole inspect
        server accepts up to `CARTESI_INSPECT_MAX_INFLIGHT` requests (default 64). Requests beyond
        these limits are rejected with HTTP 503 instead of waiting in a queue.

        A successful request returns HTTP 200 with a JSON body. The `status` field tells how the
        inspection ended:
        - `Accepted`: the backend accepted the request.
        - `Rejected`: the backend rejected the request.
        - `Exception`: the backend raised an exception. `exception_data` holds the exception
          payload, and `error` holds a fixed message.
        - `MachineHalted`: the machine halted while processing the request.
        - `Failed`: the node could not complete the inspection, for example because a cycle or time
          limit was reached. `error` holds a fixed message; details are only in the node logs.

        `reports` holds the reports that the backend emitted, including the ones emitted before a
        failure. Inspect reports are returned only in this response: the node does not store them,
        so they are not available through the JSON-RPC API.

      parameters:
        - in: path
          name: application
          required: true
          description: The application's name or hex encoded address.
          schema:
            type: string
          example: my-dapp

      requestBody:
        required: false
        description: Raw inspect payload, passed unchanged to the application backend. At most 2 MiB.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary

      responses:
        "200":
          description: Inspect state response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectResponse"

        "400":
          description: Bad request. The request body could not be read.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"

        "404":
          description: Application not found. The node does not know the application.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"

        "405":
          description: Method not allowed. Only `POST` is accepted (the response has an `Allow` header).
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"

        "413":
          description: Payload too large. The request body is larger than 2 MiB.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"

        "500":
          description: Internal error in the node.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"

        "503":
          description: |
            Service unavailable. The inspect cannot run now. The body tells which case applies:
            - `service at capacity`: the inspect server already has `CARTESI_INSPECT_MAX_INFLIGHT`
              requests in flight. The response has a `Retry-After` header (in seconds).
            - `Application inspect at capacity`: the application already runs `max_concurrent_inspects`
              inspect requests. Retry later.
            - `Machine not ready`: the node has no machine loaded for the application, or the machine
              was closed.
            - `Application is terminal; inspect unavailable`: the application status is terminal
              (for example `DIVERGED` or `GUEST_EXCEPTION`). Retrying does not help.
            - `Application was foreclosed; machine unavailable`: the application was foreclosed and the
              node no longer keeps its machine. Retrying does not help.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    InspectResponse:
      type: object
      required:
        - status
        - reports
        - processed_input_count
      properties:
        status:
          $ref: "#/components/schemas/CompletionStatus"
        error:
          type: string
          description: |
            Fixed, human-readable message. Present only when `status` is `Exception` or `Failed`.
          example: "The node could not complete the inspection"
        exception_data:
          $ref: "#/components/schemas/ExceptionData"
        reports:
          type: array
          description: Reports emitted by the backend while processing the request.
          items:
            $ref: "#/components/schemas/Report"
        processed_input_count:
          type: integer
          description: Number of inputs processed by the machine state that served this inspect request.
          example: 0

    CompletionStatus:
      type: string
      description: How the inspection ended.
      enum:
        [
          Accepted,
          Rejected,
          Exception,
          MachineHalted,
          Failed,
        ]
      example: "Accepted"

    Payload:
      type: string
      description: |
        Payload in the Ethereum hex binary format.
        The first two characters are '0x' followed by pairs of hexadecimal numbers that correspond to one byte.
        For instance, '0xdeadbeef' corresponds to a payload with length 4 and bytes 222, 173, 190, 175.
        An empty payload is represented by the string '0x'.
      example: "0xdeadbeef"

    ExceptionData:
      type: string
      description: |
        Exception payload provided by the backend, in the Ethereum hex binary format.
        Present only when `status` is `Exception`.
      example: "0xdeadbeef"

    Report:
      type: object
      properties:
        payload:
          $ref: "#/components/schemas/Payload"

    Error:
      type: string
      description: Detailed error message.
      example: "Application not found"
