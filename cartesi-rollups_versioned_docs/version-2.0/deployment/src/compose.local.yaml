# Cartesi Rollups Node 2.0.0-alpha.12 (images 0.12.0-alpha.41).
# Testnet-oriented compose. The EVM reader polls HTTP only; do not set
# CARTESI_BLOCKCHAIN_WS_ENDPOINT (unsupported in alpha.12).
# Factory defaults are cartesi-rollups 3.0.0-alpha.6 (identical CREATE2
# addresses on Ethereum / Optimism / Arbitrum / Base mainnet and Sepolia).
# Wipe the database volume when upgrading from 0.12.0-alpha.39 (node alpha.11).
name: cartesi-rollups-node
x-env: &env
  CARTESI_LOG_LEVEL: info
  CARTESI_AUTH_KIND: ${AUTH_KIND}
  CARTESI_BLOCKCHAIN_ID: ${BLOCKCHAIN_ID}
  CARTESI_AUTH_PRIVATE_KEY: ${CARTESI_AUTH_PRIVATE_KEY}
  CARTESI_BLOCKCHAIN_HTTP_ENDPOINT: ${BLOCKCHAIN_HTTP_ENDPOINT}
  CARTESI_SNAPSHOTS_DIR: "/var/lib/cartesi-rollups-node/snapshot"
  CARTESI_CONTRACTS_INPUT_BOX_ADDRESS: ${CARTESI_CONTRACTS_INPUT_BOX_ADDRESS:-0x346B3df038FE9f8380071eC6514D5a83aD143939}
  CARTESI_CONTRACTS_AUTHORITY_FACTORY_ADDRESS: ${CARTESI_CONTRACTS_AUTHORITY_FACTORY_ADDRESS:-0x3C1FE01c542a88A523FF6847eD1E26176c8C4ED0}
  CARTESI_CONTRACTS_APPLICATION_FACTORY_ADDRESS: ${CARTESI_CONTRACTS_APPLICATION_FACTORY_ADDRESS:-0xC549F89cF1ca43eDDECC64Ac2208F4b283B1c483}
  CARTESI_CONTRACTS_SELF_HOSTED_APPLICATION_FACTORY_ADDRESS: ${CARTESI_CONTRACTS_SELF_HOSTED_APPLICATION_FACTORY_ADDRESS:-0x6145C5996a71a379E030aEb0440df79D60833418}
  CARTESI_CONTRACTS_QUORUM_FACTORY_ADDRESS: ${CARTESI_CONTRACTS_QUORUM_FACTORY_ADDRESS:-0x1f94009389F408B8D0ADfFcF8BBDCe5552BaCa5F}
  CARTESI_DATABASE_CONNECTION: postgres://postgres:password@database:5432/rollupsdb?sslmode=disable
  CARTESI_EPOCH_LENGTH: 1
  CARTESI_BLOCKCHAIN_DEFAULT_BLOCK: ${CARTESI_BLOCKCHAIN_DEFAULT_BLOCK:-latest}

services:
  database:
    container_name: database
    image: cartesi/rollups-database:0.12.0-alpha.41
    environment:
      POSTGRES_PASSWORD: password
    networks:
      - default
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres || exit 1
      timeout: 1s
      interval: 10s
      retries: 5
      start_period: 10s
      start_interval: 200ms

  evm-reader:
    container_name: evm-reader
    image: cartesi/rollups-runtime:0.12.0-alpha.41
    command: cartesi-rollups-evm-reader --default-block ${CARTESI_BLOCKCHAIN_DEFAULT_BLOCK:-latest}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - default
    ports:
      - "10001:10001"
    environment:
      <<: *env

  advancer:
    container_name: advancer
    image: cartesi/rollups-runtime:0.12.0-alpha.41
    command: cartesi-rollups-advancer
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - data:/var/lib/cartesi-rollups-node/data
      - .cartesi/image:/var/lib/cartesi-rollups-node/snapshot/
    networks:
      - default
    ports:
      - "10002:10002"
      - "10012:10012"
    environment:
      <<: *env

  validator:
    container_name: validator
    image: cartesi/rollups-runtime:0.12.0-alpha.41
    command: cartesi-rollups-validator
    depends_on:
      database:
        condition: service_healthy
    networks:
      - default
    ports:
      - "10003:10003"
    environment:
      <<: *env

  claimer:
    container_name: claimer
    image: cartesi/rollups-runtime:0.12.0-alpha.41
    command: cartesi-rollups-claimer
    depends_on:
      database:
        condition: service_healthy
    networks:
      - default
    ports:
      - "10004:10004"
    environment:
      <<: *env

  jsonrpc-api:
    container_name: jsonrpc-api
    image: cartesi/rollups-runtime:0.12.0-alpha.41
    command: cartesi-rollups-jsonrpc-api
    depends_on:
      database:
        condition: service_healthy
    networks:
      - default
    ports:
      - "10005:10005"
      - "10011:10011"
    environment:
      <<: *env

volumes:
  data:
